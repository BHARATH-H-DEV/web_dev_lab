<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens Example</title>
    <style>
        :root {
            --color-primary: rgb(157, 229, 224);
            --color-primary-dark: rgb(120, 195, 190);
            --color-bg: #f4f4f4;
            --color-surface: white;
            --color-text: rgb(220, 124, 124);
            --font-main: system-ui, sans-serif;
            --space: 16px;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            color: var(--color-text);
            background: var(--color-bg);
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .card {
            background: var(--color-surface);
            padding: var(--space);
            border-radius: var(--radius);
            border: 2px solid var(--color-primary);
            max-width: 300px;
            width: 100%;
        }

        h2 {
            font-size: 1.25rem;
            margin: 0 0 8px 0;
        }

        p {
            margin: 0 0 var(--space) 0;
        }

        button {
            background: var(--color-primary);
            color: #2c4c48; /* Darker text for readability */
            padding: 8px var(--space);
            border: none;
            border-radius: var(--radius);
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: var(--color-primary-dark);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Token Example</h2>
        <p>This card uses design tokens for its padding, border, and colors.</p>
        <button>Action</button>
    </div>

</body>
</html>
